name: "Build & Download Take It Suite (Food, Ride, Transport, Admin)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-takeit-apks:
    name: "Build 4 Take It APKs (Food + Ride + Transport + Admin) & Auto Sync Firebase"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20 (for Firebase Rules auto-deploy)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Cache persistent fallback debug.keystore
        uses: actions/cache@v4
        with:
          path: .ci-keystore/debug.keystore
          key: takeit-persistent-debug-keystore-v1

      - name: Prepare debug.keystore for APK signing
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "$DEBUG_KEYSTORE_SECRET" | tr -d '\n\r ' | base64 -d > debug.keystore
            echo "Decoded debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ -f ".ci-keystore/debug.keystore" ]; then
            cp .ci-keystore/debug.keystore debug.keystore
            echo "Restored persistent cached debug.keystore"
          elif [ ! -f "debug.keystore" ]; then
            mkdir -p .ci-keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=TakeIt,C=IN"
            cp debug.keystore .ci-keystore/debug.keystore
            echo "Generated & cached persistent debug.keystore"
          fi

          CERT_OUT=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey)
          APK_SHA1=$(echo "$CERT_OUT" | grep -m1 "SHA1:" | sed 's/.*SHA1:[[:space:]]*//' | tr -d '\r\n ')
          APK_SHA256=$(echo "$CERT_OUT" | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//' | tr -d '\r\n ')
          APK_SHA1_HEX=$(echo "$APK_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256_HEX=$(echo "$APK_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          echo "============================================================"
          echo "ACTUAL APK SIGNING SHA-1  : $APK_SHA1"
          echo "ACTUAL APK SIGNING SHA-256: $APK_SHA256"
          echo "============================================================"
          echo "APK_SHA1=$APK_SHA1" >> $GITHUB_ENV
          echo "APK_SHA256=$APK_SHA256" >> $GITHUB_ENV
          echo "APK_SHA1_HEX=$APK_SHA1_HEX" >> $GITHUB_ENV
          echo "APK_SHA256_HEX=$APK_SHA256_HEX" >> $GITHUB_ENV

      - name: Connect Client Firebase (google-services.json + Auto SHA Sync + Firestore DB)
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DB_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request, urllib.parse, urllib.error

          raw = os.environ.get("GOOGLE_SERVICES_SECRET", "").strip()
          if not raw:
              print("GOOGLE_SERVICES_JSON_BASE64 not set; keeping repository google-services.json.")
              sys.exit(0)

          if raw.startswith("{"):
              decoded_text = raw
          else:
              cleaned = "".join(raw.split())
              decoded_text = base64.b64decode(cleaned).decode("utf-8")

          data = json.loads(decoded_text)
          project_id = data.get("project_info", {}).get("project_id", "")
          clients = data.get("client", [])

          selected_pkg = ""
          selected_app_id = ""
          registered_sha1s = set()
          has_web_oauth = False
          has_android_oauth = False
          for c in clients:
              pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              app_id = c.get("client_info", {}).get("mobilesdk_app_id", "")
              oauths = c.get("oauth_client", []) or []
              web_ok = any(o.get("client_type") == 3 for o in oauths)
              android_ok = any(o.get("client_type") == 1 for o in oauths)
              if pkg and not selected_pkg:
                  selected_pkg = pkg
                  selected_app_id = app_id
              if pkg and web_ok and android_ok:
                  selected_pkg = pkg
                  selected_app_id = app_id
                  has_web_oauth = True
                  has_android_oauth = True
                  for o in oauths:
                      h = (o.get("android_info") or {}).get("certificate_hash", "").lower()
                      if h:
                          registered_sha1s.add(h)
                  break
              if web_ok:
                  has_web_oauth = True
              if android_ok:
                  has_android_oauth = True

          apk_sha1_hex = os.environ.get("APK_SHA1_HEX", "").strip().lower()
          apk_sha256_hex = os.environ.get("APK_SHA256_HEX", "").strip().lower()
          sha1_matches = bool(apk_sha1_hex and apk_sha1_hex in registered_sha1s)

          print(f"Configured Client Firebase project_id={project_id}, package_name={selected_pkg}, app_id={selected_app_id}")
          print(f"OAuth check -> Android OAuth Client (type 1): {has_android_oauth}, Web Client ID (type 3): {has_web_oauth}")
          print(f"SHA-1 Match Check -> APK={apk_sha1_hex}, Registered={sorted(registered_sha1s)}, MATCH={sha1_matches}")

          # Auto-register ACTUAL APK SHA-1 & SHA-256 into Client Firebase via Firebase Management REST API
          sa_raw = os.environ.get("FIREBASE_SA_SECRET", "").strip()
          if sa_raw and project_id and selected_app_id and apk_sha1_hex:
              key_path = "/tmp/firebase-sha-sa.pem"
              try:
                  sa_text = sa_raw if sa_raw.startswith("{") else base64.b64decode("".join(sa_raw.split())).decode("utf-8")
                  sa_data = json.loads(sa_text)
                  with open(key_path, "w", encoding="utf-8") as f:
                      f.write(sa_data["private_key"])

                  def b64url(b: bytes) -> str:
                      return base64.urlsafe_b64encode(b).rstrip(b"=").decode("ascii")

                  now = int(time.time())
                  header = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
                  claim = b64url(json.dumps({
                      "iss": sa_data["client_email"],
                      "scope": "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/firebase",
                      "aud": "https://oauth2.googleapis.com/token",
                      "iat": now,
                      "exp": now + 3600,
                  }).encode())
                  sig = subprocess.check_output(["openssl", "dgst", "-sha256", "-sign", key_path], input=f"{header}.{claim}".encode())
                  assertion = f"{header}.{claim}.{b64url(sig)}"
                  token_req = urllib.request.Request(
                      "https://oauth2.googleapis.com/token",
                      data=urllib.parse.urlencode({
                          "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                          "assertion": assertion,
                      }).encode(),
                      headers={"Content-Type": "application/x-www-form-urlencoded"},
                  )
                  with urllib.request.urlopen(token_req, timeout=20) as resp:
                      access_token = json.loads(resp.read().decode())["access_token"]

                  sha_changed = False
                  for cert_type, sha_val in (("SHA_1", apk_sha1_hex), ("SHA_256", apk_sha256_hex)):
                      if not sha_val:
                          continue
                      if cert_type == "SHA_1" and sha1_matches:
                          continue
                      try:
                          sha_req = urllib.request.Request(
                              f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps/{selected_app_id}/sha",
                              data=json.dumps({"shaHash": sha_val, "certType": cert_type}).encode(),
                              headers={
                                  "Authorization": f"Bearer {access_token}",
                                  "Content-Type": "application/json",
                              },
                              method="POST",
                          )
                          with urllib.request.urlopen(sha_req, timeout=20) as resp:
                              print(f"Auto-registered {cert_type} ({sha_val}) in Firebase {project_id}!")
                              sha_changed = True
                      except urllib.error.HTTPError as he:
                          body = he.read().decode("utf-8", errors="ignore")
                          if he.code == 409 or "ALREADY_EXISTS" in body:
                              print(f"{cert_type} already registered in Firebase {project_id}.")
                          else:
                              print(f"Firebase Management API notice for {cert_type} (HTTP {he.code}): {body[:300]}")

                  if sha_changed or not sha1_matches:
                      time.sleep(3)
                      cfg_req = urllib.request.Request(
                          f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps/{selected_app_id}/config",
                          headers={"Authorization": f"Bearer {access_token}"},
                          method="GET",
                      )
                      with urllib.request.urlopen(cfg_req, timeout=20) as resp:
                          cfg_json = json.loads(resp.read().decode())
                          cfg_b64 = cfg_json.get("configFileContents", "")
                          if cfg_b64:
                              data = json.loads(base64.b64decode(cfg_b64).decode("utf-8"))
                              print("Downloaded freshly synced Customer google-services.json from Firebase Management API!")

                  # Auto-create & sync all 3 companion Android Apps (<pkg>.ride, <pkg>.transport, <pkg>.admin) so all 4 apps install side-by-side on ONE phone!
                  base_pkg = selected_pkg or "com.aistudio.zipora.kxrqmt"
                  companions = [
                      ("ride", "Take It Ride"),
                      ("transport", "Take It Transport"),
                      ("admin", "Take It Admin"),
                  ]
                  apps_list = []
                  try:
                      apps_req = urllib.request.Request(
                          f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps?pageSize=100",
                          headers={"Authorization": f"Bearer {access_token}"},
                          method="GET",
                      )
                      with urllib.request.urlopen(apps_req, timeout=20) as resp:
                          apps_list = json.loads(resp.read().decode()).get("apps", [])
                  except Exception as le:
                      print(f"Could not list Firebase apps: {le}")

                  for suffix, disp_name in companions:
                      comp_pkg = f"{base_pkg}.{suffix}"
                      comp_app_id = ""
                      try:
                          for a in apps_list:
                              if a.get("packageName", "").lower() == comp_pkg.lower():
                                  comp_app_id = a.get("appId", "")
                                  print(f"Found existing {disp_name} Firebase App: {comp_pkg} ({comp_app_id})")
                                  break

                          if not comp_app_id:
                              print(f"Creating Firebase Android App for {comp_pkg} automatically...")
                              create_req = urllib.request.Request(
                                  f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps",
                                  data=json.dumps({"packageName": comp_pkg, "displayName": disp_name}).encode(),
                                  headers={
                                      "Authorization": f"Bearer {access_token}",
                                      "Content-Type": "application/json",
                                  },
                                  method="POST",
                              )
                              with urllib.request.urlopen(create_req, timeout=25) as resp:
                                  op = json.loads(resp.read().decode())
                                  op_name = op.get("name", "")
                                  for _ in range(15):
                                      if op.get("done") or not op_name:
                                          break
                                      time.sleep(2)
                                      poll_req = urllib.request.Request(
                                          f"https://firebase.googleapis.com/v1beta1/{op_name}",
                                          headers={"Authorization": f"Bearer {access_token}"},
                                          method="GET",
                                      )
                                      with urllib.request.urlopen(poll_req, timeout=20) as presp:
                                          op = json.loads(presp.read().decode())
                                  comp_app_id = (op.get("response") or {}).get("appId", "")
                                  print(f"Auto-created {disp_name} Firebase App: {comp_pkg} ({comp_app_id})!")

                          if comp_app_id:
                              for cert_type, sha_val in (("SHA_1", apk_sha1_hex), ("SHA_256", apk_sha256_hex)):
                                  if not sha_val:
                                      continue
                                  try:
                                      sha_req = urllib.request.Request(
                                          f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps/{comp_app_id}/sha",
                                          data=json.dumps({"shaHash": sha_val, "certType": cert_type}).encode(),
                                          headers={
                                              "Authorization": f"Bearer {access_token}",
                                              "Content-Type": "application/json",
                                          },
                                          method="POST",
                                      )
                                      with urllib.request.urlopen(sha_req, timeout=20) as resp:
                                          print(f"Auto-registered {disp_name} {cert_type} ({sha_val})!")
                                  except urllib.error.HTTPError as he:
                                      body = he.read().decode("utf-8", errors="ignore")
                                      if he.code == 409 or "ALREADY_EXISTS" in body:
                                          print(f"{disp_name} {cert_type} already registered.")
                                      else:
                                          print(f"{disp_name} SHA notice ({cert_type}): HTTP {he.code} {body[:200]}")

                              time.sleep(2)
                              ccfg_req = urllib.request.Request(
                                  f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps/{comp_app_id}/config",
                                  headers={"Authorization": f"Bearer {access_token}"},
                                  method="GET",
                              )
                              with urllib.request.urlopen(ccfg_req, timeout=20) as resp:
                                  ccfg_json = json.loads(resp.read().decode())
                                  ccfg_b64 = ccfg_json.get("configFileContents", "")
                                  if ccfg_b64:
                                      comp_data = json.loads(base64.b64decode(ccfg_b64).decode("utf-8"))
                                      with open(f"/tmp/google-services-{suffix}.json", "w", encoding="utf-8") as cf:
                                          json.dump(comp_data, cf, indent=2)
                                      print(f"Downloaded freshly synced {disp_name} google-services-{suffix}.json!")
                      except Exception as ce:
                          print(f"{disp_name} Firebase auto-app notice (falling back to cloned OAuth client config): {ce}")
              except Exception as e:
                  print(f"Auto SHA sync notice: {e}")
              finally:
                  if os.path.exists(key_path):
                      os.remove(key_path)

          # Ensure /tmp/google-services-{ride,transport,admin}.json always contain a valid client entry
          base_pkg = selected_pkg or "com.aistudio.zipora.kxrqmt"
          ride_pkg = f"{base_pkg}.ride"
          transport_pkg = f"{base_pkg}.transport"
          admin_pkg = f"{base_pkg}.admin"
          for suffix, comp_pkg in (("ride", ride_pkg), ("transport", transport_pkg), ("admin", admin_pkg)):
              out_path = f"/tmp/google-services-{suffix}.json"
              if not os.path.exists(out_path):
                  comp_fallback = json.loads(json.dumps(data))
                  for c in comp_fallback.get("client", []):
                      if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == selected_pkg:
                          cloned = json.loads(json.dumps(c))
                          cloned["client_info"]["android_client_info"]["package_name"] = comp_pkg
                          comp_fallback["client"].append(cloned)
                          break
                  with open(out_path, "w", encoding="utf-8") as cf:
                      json.dump(comp_fallback, cf, indent=2)
                  print(f"Prepared fallback google-services-{suffix}.json with package={comp_pkg}")

          with open("/tmp/google-services-customer.json", "w", encoding="utf-8") as cf:
              json.dump(data, cf, indent=2)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          db_id = (os.environ.get("FIRESTORE_DB_ID") or "(default)").strip() or "(default)"
          xml_content = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              f'    <string name="firestore_database_id" translatable="false">{db_id}</string>\n'
              '</resources>\n'
          )
          os.makedirs("app/src/main/res/values", exist_ok=True)
          with open("app/src/main/res/values/firebase_applet_config.xml", "w", encoding="utf-8") as f:
              f.write(xml_content)
          print(f"Configured firebase_applet_config.xml -> database={db_id}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  if project_id:
                      f.write(f"CLIENT_FIREBASE_PROJECT_ID={project_id}\n")
                  f.write(f"CLIENT_FIRESTORE_DB_ID={db_id}\n")
                  if selected_pkg:
                      f.write(f"CLIENT_APP_ID={selected_pkg}\n")
                  f.write(f"RIDE_APP_ID={ride_pkg}\n")
                  f.write(f"TRANSPORT_APP_ID={transport_pkg}\n")
                  f.write(f"ADMIN_APP_ID={admin_pkg}\n")
          PY

      - name: Auto-Deploy Firestore Security Rules to Client Firebase
        continue-on-error: true
        env:
          FIREBASE_SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, time, urllib.request, urllib.parse, urllib.error

          raw = os.environ.get("FIREBASE_SA_SECRET", "").strip()
          if not raw:
              print("FIREBASE_SERVICE_ACCOUNT secret not set; skipping automatic rules deploy.")
              sys.exit(0)

          if raw.startswith("{"):
              sa_text = raw
          else:
              cleaned = "".join(raw.split())
              sa_text = base64.b64decode(cleaned).decode("utf-8")

          sa_data = json.loads(sa_text)
          project_id = os.environ.get("CLIENT_FIREBASE_PROJECT_ID") or sa_data.get("project_id", "")
          db_id = os.environ.get("CLIENT_FIRESTORE_DB_ID") or "(default)"

          if not project_id:
              print("Could not resolve Firebase project_id for rules deployment.")
              sys.exit(1)

          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode("ascii")

          key_path = "/tmp/firebase-sa-key.pem"
          sa_path = "/tmp/firebase-service-account.json"
          with open(sa_path, "w", encoding="utf-8") as f:
              json.dump(sa_data, f)
          with open(key_path, "w", encoding="utf-8") as f:
              f.write(sa_data["private_key"])

          try:
              # 1) Mint OAuth2 access token and deploy directly via Firebase Rules REST API (bypasses serviceusage 403!)
              now = int(time.time())
              header = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
              claim = b64url(json.dumps({
                  "iss": sa_data["client_email"],
                  "scope": "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/firebase",
                  "aud": "https://oauth2.googleapis.com/token",
                  "iat": now,
                  "exp": now + 3600,
              }).encode())
              signing_input = f"{header}.{claim}".encode()
              sig = subprocess.check_output(
                  ["openssl", "dgst", "-sha256", "-sign", key_path],
                  input=signing_input,
              )
              assertion = f"{header}.{claim}.{b64url(sig)}"
              token_req = urllib.request.Request(
                  "https://oauth2.googleapis.com/token",
                  data=urllib.parse.urlencode({
                      "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                      "assertion": assertion,
                  }).encode(),
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              with urllib.request.urlopen(token_req, timeout=20) as resp:
                  access_token = json.loads(resp.read().decode())["access_token"]

              with open("firestore.rules", "r", encoding="utf-8") as f:
                  rules_content = f.read()

              ruleset_body = json.dumps({
                  "source": {
                      "files": [{"name": "firestore.rules", "content": rules_content}]
                  }
              }).encode()
              create_req = urllib.request.Request(
                  f"https://firebaserules.googleapis.com/v1/projects/{project_id}/rulesets",
                  data=ruleset_body,
                  headers={
                      "Authorization": f"Bearer {access_token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(create_req, timeout=25) as resp:
                  ruleset_name = json.loads(resp.read().decode())["name"]
              print(f"Created ruleset: {ruleset_name}")

              release_id = "cloud.firestore" if db_id == "(default)" else f"cloud.firestore/{db_id}"
              release_full = f"projects/{project_id}/releases/{release_id}"
              patch_body = json.dumps({
                  "release": {
                      "name": release_full,
                      "rulesetName": ruleset_name,
                  }
              }).encode()
              patch_req = urllib.request.Request(
                  f"https://firebaserules.googleapis.com/v1/{release_full}",
                  data=patch_body,
                  headers={
                      "Authorization": f"Bearer {access_token}",
                      "Content-Type": "application/json",
                  },
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(patch_req, timeout=25) as resp:
                      print("Firestore security rules deployed directly via Firebase Rules REST API!")
              except urllib.error.HTTPError as pe:
                  if pe.code == 404:
                      post_body = json.dumps({
                          "name": release_full,
                          "rulesetName": ruleset_name,
                      }).encode()
                      post_req = urllib.request.Request(
                          f"https://firebaserules.googleapis.com/v1/projects/{project_id}/releases",
                          data=post_body,
                          headers={
                              "Authorization": f"Bearer {access_token}",
                              "Content-Type": "application/json",
                          },
                          method="POST",
                      )
                      with urllib.request.urlopen(post_req, timeout=25) as resp:
                          print("Created Firestore rules release directly via Firebase Rules REST API!")
                  else:
                      raise
          except Exception as rest_err:
              print(f"Direct REST rules deploy notice: {rest_err}")
              # Fallback to firebase-tools CLI
              fb_cfg = {
                  "firestore": [{"database": db_id, "rules": "firestore.rules"}]
              }
              with open("firebase.json", "w", encoding="utf-8") as f:
                  json.dump(fb_cfg, f, indent=2)
              env = os.environ.copy()
              env["GOOGLE_APPLICATION_CREDENTIALS"] = sa_path
              subprocess.run(
                  ["npx", "--yes", "firebase-tools", "deploy", "--only", "firestore:rules", "--project", project_id, "--non-interactive", "--force"],
                  check=True,
                  env=env,
              )
              print("Firestore security rules deployed via firebase-tools!")
          finally:
              for p in (sa_path, key_path):
                  if os.path.exists(p):
                      os.remove(p)
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Inject API secrets into .env
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          : > .env
          if [ -n "$IMGBB_API_KEY" ]; then
            echo "IMGBB_API_KEY=$IMGBB_API_KEY" >> .env
            echo "Configured IMGBB_API_KEY from GitHub Secrets."
          else
            echo "IMGBB_API_KEY=YOUR_IMGBB_API_KEY" >> .env
            echo "IMGBB_API_KEY secret not set; using placeholder."
          fi
          if [ -n "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
            echo "Configured PEXELS_API_KEY from GitHub Secrets."
          else
            echo "PEXELS_API_KEY=YOUR_PEXELS_API_KEY" >> .env
            echo "PEXELS_API_KEY secret not set; using offline fallback placeholder."
          fi

      - name: Build All 4 Standalone APKs (Food, Ride, Transport, Admin)
        run: |
          mkdir -p release-apk
          CUST_APP_ID_ARG=""
          if [ -n "$CLIENT_APP_ID" ]; then
            CUST_APP_ID_ARG="-PtakeItAppId=$CLIENT_APP_ID"
          fi
          RIDE_PKG="${RIDE_APP_ID:-com.aistudio.zipora.kxrqmt.ride}"
          TRANSPORT_PKG="${TRANSPORT_APP_ID:-com.aistudio.zipora.kxrqmt.transport}"
          ADMIN_PKG="${ADMIN_APP_ID:-com.aistudio.zipora.kxrqmt.admin}"

          echo "=== [1/4] Building TakeIt-Customer.apk (Food Delivery: ${CLIENT_APP_ID:-default}) ==="
          [ -f /tmp/google-services-customer.json ] && cp /tmp/google-services-customer.json app/google-services.json
          gradle :app:assembleDebug $CUST_APP_ID_ARG -PtakeItAppMode=CUSTOMER -PtakeItAppLabel="Take It" --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/TakeIt-Customer.apk

          echo "=== [2/4] Building TakeIt-Ride.apk (Rapido Ride: $RIDE_PKG) ==="
          rm -rf app/build
          [ -f /tmp/google-services-ride.json ] && cp /tmp/google-services-ride.json app/google-services.json
          gradle :app:assembleDebug -PtakeItAppId=$RIDE_PKG -PtakeItAppMode=RIDE -PtakeItAppLabel="Take It Ride" --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/TakeIt-Ride.apk

          echo "=== [3/4] Building TakeIt-Transport.apk (Parcel & Truck Transport: $TRANSPORT_PKG) ==="
          rm -rf app/build
          [ -f /tmp/google-services-transport.json ] && cp /tmp/google-services-transport.json app/google-services.json
          gradle :app:assembleDebug -PtakeItAppId=$TRANSPORT_PKG -PtakeItAppMode=TRANSPORT -PtakeItAppLabel="Take It Transport" --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/TakeIt-Transport.apk

          echo "=== [4/4] Building TakeIt-Admin.apk (Executive Command Center: $ADMIN_PKG) ==="
          rm -rf app/build
          [ -f /tmp/google-services-admin.json ] && cp /tmp/google-services-admin.json app/google-services.json
          gradle :app:assembleDebug -PtakeItAppId=$ADMIN_PKG -PtakeItAppMode=ADMIN -PtakeItAppLabel="Take It Admin" --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/TakeIt-Admin.apk

          ls -lh release-apk/

      - name: Upload 1/4 TakeIt-Customer.apk
        uses: actions/upload-artifact@v4
        with:
          name: 1-TakeIt-Customer-APK
          path: release-apk/TakeIt-Customer.apk
          retention-days: 30

      - name: Upload 2/4 TakeIt-Ride.apk
        uses: actions/upload-artifact@v4
        with:
          name: 2-TakeIt-Ride-APK
          path: release-apk/TakeIt-Ride.apk
          retention-days: 30

      - name: Upload 3/4 TakeIt-Transport.apk
        uses: actions/upload-artifact@v4
        with:
          name: 3-TakeIt-Transport-APK
          path: release-apk/TakeIt-Transport.apk
          retention-days: 30

      - name: Upload 4/4 TakeIt-Admin.apk
        uses: actions/upload-artifact@v4
        with:
          name: 4-TakeIt-Admin-APK
          path: release-apk/TakeIt-Admin.apk
          retention-days: 30

      - name: "Publish All 4 Take It APKs to Latest Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Take It Suite - 4 Standalone Apps (Food, Ride, Transport, Admin)"
          body: |
            ### Download & Install All 4 Distinct Take It Apps Side-by-Side
            1. **TakeIt-Customer.apk** — Full **Take It Food Delivery** App (Animated Food Welcome, Zomato-grade UI, Sticky Payment Button, Live Tracking)
            2. **TakeIt-Ride.apk** — Distinct **Take It Ride** (Rapido-style Bike Moto, Auto, Mini Cab, Prime Sedan + Animated Ride Welcome + Live Captain OTP)
            3. **TakeIt-Transport.apk** — Distinct **Take It Transport** (2W Parcel, 3W Cargo, Tata Ace Mini Truck, 8ft Pickup + Animated Transport Welcome + Live OTP)
            4. **TakeIt-Admin.apk** — Distinct Obsidian/Gold **Take It Executive Admin Command Center** (`buildolive4@gmail.com` Main Admin + Co-Admin Password System + Live Food/Ride/Parcel Dispatch + Razorpay Ledger)

            - Forced **Google Account Chooser** enabled across all 4 apps
            - Auto-synced APK SHA-1/SHA-256 & deployed Firestore Security Rules
            - Built automatically on commit `${{ github.sha }}`
          files: |
            release-apk/TakeIt-Customer.apk
            release-apk/TakeIt-Ride.apk
            release-apk/TakeIt-Transport.apk
            release-apk/TakeIt-Admin.apk
          make_latest: true
        continue-on-error: true
